<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="1000" height="230" role="img" aria-label="Jami — builds things that live in the terminal">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.3" fill="#151b28"/>
    </pattern>
  </defs>
  <rect width="1000" height="230" fill="#0d1420"/>
  <rect width="1000" height="230" fill="url(#dots)"/>
  <rect x="1" y="1" width="998" height="228" rx="14" fill="none" stroke="#1c2230" stroke-width="2"/>
  <text x="760" y="168" font-family="monospace" font-size="110" font-weight="700" fill="#121a28">&lt;/&gt;</text>
  <text x="60" y="122" font-family="monospace" font-size="22" fill="#EF9F27">~/</text>
  <text x="98" y="126" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-weight="700" fill="#f6f8fa" letter-spacing="-2">Jami</text>
  <rect x="312" y="78" width="16" height="60" fill="#EF9F27">
    <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
  </rect>
  <text x="62" y="172" font-family="monospace" font-size="20" fill="#6e7681">builds things that live in the terminal.</text>
</svg>
