<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="A rocket voyaging through space, passing the name Jami and other cosmic encounters">
  <style>
    text{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
    .world{animation:world 16s linear -4s infinite}
    @keyframes world{to{transform:translateX(-2400px)}}
    .dodge{animation:dodge 16s ease-in-out -4s infinite}
    @keyframes dodge{0%,5%{transform:translateY(0)}8%{transform:translateY(-28px)}12%{transform:translateY(-28px)}16%,100%{transform:translateY(0)}}
    .wob{transform-box:fill-box;transform-origin:center;animation:wob 2.4s ease-in-out infinite}
    @keyframes wob{0%,100%{transform:translateY(0) rotate(0deg)}30%{transform:translateY(-5px) rotate(-1.5deg)}65%{transform:translateY(4px) rotate(1.5deg)}}
    .flame{transform-box:fill-box;transform-origin:right center;animation:flick .32s ease-in-out infinite}
    @keyframes flick{0%,100%{transform:scaleX(1)}25%{transform:scaleX(1.28)}55%{transform:scaleX(.78)}80%{transform:scaleX(1.15)}}
    .eg{animation:eg .32s ease-in-out infinite}
    @keyframes eg{0%,100%{opacity:.15}50%{opacity:.4}}
    .pufT{animation:pufT 1s linear infinite}
    @keyframes pufT{0%{transform:translateX(0);opacity:.7}100%{transform:translateX(-75px);opacity:0}}
    .pf2{animation-delay:.33s}.pf3{animation-delay:.66s}
    .dr1{animation:drift 60s linear infinite}
    .dr2{animation:drift 25s linear infinite}
    @keyframes drift{to{transform:translateX(-900px)}}
    .zip{animation:zip 1.6s linear infinite;opacity:0}
    @keyframes zip{0%{transform:translateX(0);opacity:0}8%{opacity:.2}90%{opacity:.12}100%{transform:translateX(-1150px);opacity:0}}
    .z2{animation-delay:.55s}.z3{animation-delay:1.1s}
    .tw{animation:tw 3.2s ease-in-out infinite}
    @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
    .fw{animation:fw 16s linear infinite}
    @keyframes fw{0%,46%{opacity:.85}50%{opacity:1}55%,100%{opacity:.85}}
    .fg{animation:fg 16s linear infinite}
    @keyframes fg{0%,46%{opacity:0}50%{opacity:.95}56%,100%{opacity:0}}
    .wj{animation-delay:-6.575s}.wa{animation-delay:-6.089s}.wm{animation-delay:-5.602s}.wi{animation-delay:-5.115s}
    .ubob{animation:ubob 3s ease-in-out infinite}
    @keyframes ubob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    .ult{animation:ult 1.2s step-end infinite}
    @keyframes ult{0%,100%{opacity:1}50%{opacity:.15}}
    .u2{animation-delay:.4s}.u3{animation-delay:.8s}
  </style>
  <defs>
    <linearGradient id="bgg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05080f"/><stop offset="1" stop-color="#0d1522"/>
    </linearGradient>
    <radialGradient id="neb1" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#EF9F27" stop-opacity=".09"/><stop offset="1" stop-color="#EF9F27" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb2" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#58a6ff" stop-opacity=".08"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pg" cx=".35" cy=".35" r=".8">
      <stop offset="0" stop-color="#3d4f6e"/><stop offset="1" stop-color="#141d2c"/>
    </radialGradient>
    <radialGradient id="apg" cx=".5" cy=".18" r=".85">
      <stop offset="0" stop-color="#2e4a40"/><stop offset="1" stop-color="#0f1b17"/>
    </radialGradient>
    <linearGradient id="trg" gradientUnits="userSpaceOnUse" x1="-175" y1="0" x2="-42" y2="0">
      <stop offset="0" stop-color="#EF9F27" stop-opacity="0"/><stop offset="1" stop-color="#EF9F27" stop-opacity=".75"/>
    </linearGradient>
    <filter id="gl" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>
    <g id="sfar" fill="#46536b">
      <circle cx="40" cy="180" r=".8"/><circle cx="120" cy="90" r=".7"/><circle cx="260" cy="340" r=".8"/>
      <circle cx="380" cy="40" r=".7"/><circle cx="500" cy="300" r=".8"/><circle cx="640" cy="130" r=".7"/>
      <circle cx="780" cy="370" r=".8"/><circle cx="860" cy="210" r=".7"/><circle cx="180" cy="260" r=".7"/>
      <circle cx="720" cy="60" r=".8"/><circle cx="560" cy="180" r=".7"/>
    </g>
    <g id="snear" fill="#6b7c98">
      <circle cx="90" cy="140" r="1.1"/><circle cx="240" cy="240" r="1"/><circle cx="420" cy="320" r="1.1"/>
      <circle cx="560" cy="60" r="1"/><circle cx="700" cy="250" r="1.1"/><circle cx="820" cy="120" r="1"/>
      <circle cx="150" cy="350" r="1"/>
    </g>
  </defs>

  <rect x="2" y="2" width="896" height="416" rx="14" fill="url(#bgg)" stroke="#1c2230" stroke-width="2"/>
  <ellipse cx="250" cy="120" rx="220" ry="110" fill="url(#neb1)"/>
  <ellipse cx="680" cy="310" rx="240" ry="120" fill="url(#neb2)"/>

  <g class="dr1"><use href="#sfar"/><use href="#sfar" x="900"/></g>
  <g class="dr2"><use href="#snear"/><use href="#snear" x="900"/></g>

  <g fill="#dbe3ee">
    <circle class="tw" cx="70" cy="60" r="1.3" style="animation-delay:0s"/>
    <circle class="tw" cx="230" cy="50" r="1.1" style="animation-delay:1.4s"/>
    <circle class="tw" cx="420" cy="70" r="1.4" style="animation-delay:.4s"/>
    <circle class="tw" cx="610" cy="45" r="1.1" style="animation-delay:1.8s"/>
    <circle class="tw" cx="860" cy="80" r="1.2" style="animation-delay:.9s"/>
    <circle class="tw" cx="60" cy="330" r="1.1" style="animation-delay:2.3s"/>
    <circle class="tw" cx="340" cy="360" r="1.2" style="animation-delay:.6s"/>
    <circle class="tw" cx="640" cy="340" r="1.3" style="animation-delay:1s"/>
    <circle class="tw" cx="880" cy="260" r="1" style="animation-delay:1.3s"/>
    <circle class="tw" cx="500" cy="390" r="1" style="animation-delay:2.9s"/>
  </g>

  <g stroke="#8fa1bd" stroke-width="1" stroke-linecap="round">
    <line class="zip" x1="940" y1="70" x2="1005" y2="70"/>
    <line class="zip z2" x1="940" y1="235" x2="990" y2="235"/>
    <line class="zip z3" x1="940" y1="355" x2="1010" y2="355"/>
  </g>

  <g class="world">
    <g id="wc">
      <g fill="#55647e">
        <circle cx="60" cy="150" r="1"/><circle cx="180" cy="320" r="1.1"/><circle cx="520" cy="80" r="1"/>
        <circle cx="700" cy="350" r="1.2"/><circle cx="820" cy="60" r="1"/><circle cx="1350" cy="330" r="1.1"/>
        <circle cx="1420" cy="60" r="1"/><circle cx="1640" cy="180" r="1.2"/><circle cx="1750" cy="380" r="1"/>
        <circle cx="2050" cy="230" r="1.1"/><circle cx="2260" cy="90" r="1"/><circle cx="2330" cy="300" r="1.2"/>
        <circle cx="2390" cy="170" r="1"/>
      </g>
      <g stroke="#dbe3ee" stroke-width="1" stroke-linecap="round" opacity=".8">
        <g><line x1="617" y1="300" x2="623" y2="300"/><line x1="620" y1="297" x2="620" y2="303"/></g>
        <g><line x1="1697" y1="120" x2="1703" y2="120"/><line x1="1700" y1="117" x2="1700" y2="123"/></g>
      </g>

      <g>
        <path d="M 288 55 L 302 47 L 314 57 L 310 73 L 294 75 L 285 65 Z" fill="#24334d" stroke="#3a4761" stroke-width="1.5">
          <animateTransform attributeName="transform" type="rotate" values="0 300 61;360 300 61" dur="14s" repeatCount="indefinite"/>
        </path>
        <g>
          <animateTransform attributeName="transform" type="rotate" values="0 345 265;-360 345 265" dur="22s" repeatCount="indefinite"/>
          <path d="M 322 252 L 342 240 L 364 248 L 371 268 L 358 286 L 332 284 L 320 270 Z" fill="#24334d" stroke="#3a4761" stroke-width="1.5"/>
          <circle cx="338" cy="262" r="4.5" fill="#1a2536"/>
          <circle cx="356" cy="274" r="3" fill="#1a2536"/>
        </g>
        <path d="M 398 144 L 408 139 L 414 147 L 409 156 L 399 154 Z" fill="#24334d" stroke="#3a4761" stroke-width="1.5">
          <animateTransform attributeName="transform" type="rotate" values="0 406 148;360 406 148" dur="10s" repeatCount="indefinite"/>
        </path>
      </g>

      <g filter="url(#gl)" fill="#EF9F27" font-size="112" font-weight="700">
        <text class="fg wj" x="930" y="245">J</text>
        <text class="fg wa" x="1003" y="245">A</text>
        <text class="fg wm" x="1076" y="245">M</text>
        <text class="fg wi" x="1149" y="245">I</text>
      </g>
      <g fill="#f0f6fc" font-size="112" font-weight="700">
        <text class="fw wj" x="930" y="245">J</text>
        <text class="fw wa" x="1003" y="245">A</text>
        <text class="fw wm" x="1076" y="245">M</text>
        <text class="fw wi" x="1149" y="245">I</text>
      </g>
      <text x="1073" y="300" font-size="15" text-anchor="middle" fill="#6e7681">problem solver · exploring what's next</text>

      <g>
        <animateTransform attributeName="transform" type="rotate" values="-6 1500 85;6 1500 85;-6 1500 85" dur="6s" repeatCount="indefinite"/>
        <rect x="1440" y="78" width="34" height="14" rx="2" fill="#1c2942" stroke="#58a6ff" stroke-width="1"/>
        <line x1="1444" y1="82" x2="1470" y2="82" stroke="#58a6ff" stroke-width="1" opacity=".5"/>
        <line x1="1444" y1="88" x2="1470" y2="88" stroke="#58a6ff" stroke-width="1" opacity=".5"/>
        <rect x="1484" y="79" width="32" height="12" rx="3" fill="#dbe3ee" stroke="#8b98ab" stroke-width="1"/>
        <rect x="1516" y="78" width="34" height="14" rx="2" fill="#1c2942" stroke="#58a6ff" stroke-width="1"/>
        <line x1="1520" y1="82" x2="1546" y2="82" stroke="#58a6ff" stroke-width="1" opacity=".5"/>
        <line x1="1520" y1="88" x2="1546" y2="88" stroke="#58a6ff" stroke-width="1" opacity=".5"/>
        <circle cx="1500" cy="72" r="4" fill="none" stroke="#8b98ab" stroke-width="1"/>
        <circle class="ult" cx="1500" cy="68" r="2" fill="#ff5f56"/>
      </g>

      <ellipse cx="1900" cy="300" rx="68" ry="20" transform="rotate(-14 1900 300)" fill="none" stroke="#EF9F27" stroke-width="2" opacity=".5"/>
      <circle cx="1900" cy="300" r="40" fill="url(#pg)" stroke="#2c3a52" stroke-width="1"/>
      <path d="M 1840 312 Q 1900 336 1962 308" fill="none" stroke="#EF9F27" stroke-width="2" opacity=".75"/>
      <circle r="4" fill="#9aa7ba">
        <animateMotion dur="9s" repeatCount="indefinite" path="M1900 300 m-66 0 a66 20 -14 1 0 132 0 a66 20 -14 1 0 -132 0"/>
      </circle>

      <g class="ubob">
        <ellipse cx="2070" cy="95" rx="26" ry="8" fill="#2c3a52" stroke="#8b98ab" stroke-width="1"/>
        <path d="M 2060 90 A 10 9 0 0 1 2080 90 Z" fill="#0d1420" stroke="#58a6ff" stroke-width="1.5"/>
        <circle class="ult" cx="2058" cy="95" r="1.8" fill="#EF9F27"/>
        <circle class="ult" cx="2070" cy="97" r="1.8" fill="#EF9F27" style="animation-delay:.4s"/>
        <circle class="ult" cx="2082" cy="95" r="1.8" fill="#EF9F27" style="animation-delay:.8s"/>
        <ellipse cx="2360" cy="95" rx="26" ry="8" fill="#2c3a52" stroke="#8b98ab" stroke-width="1"/>
        <path d="M 2350 90 A 10 9 0 0 1 2370 90 Z" fill="#0d1420" stroke="#58a6ff" stroke-width="1.5"/>
        <circle class="ult" cx="2348" cy="95" r="1.8" fill="#EF9F27" style="animation-delay:.2s"/>
        <circle class="ult" cx="2360" cy="97" r="1.8" fill="#EF9F27" style="animation-delay:.6s"/>
        <circle class="ult" cx="2372" cy="95" r="1.8" fill="#EF9F27" style="animation-delay:1s"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" values="-1.5 2215 100;1.5 2215 100;-1.5 2215 100" dur="4s" repeatCount="indefinite"/>
          <line x1="2072" y1="103" x2="2100" y2="120" stroke="#8b98ab" stroke-width="1"/>
          <line x1="2358" y1="103" x2="2330" y2="120" stroke="#8b98ab" stroke-width="1"/>
          <rect x="2095" y="118" width="240" height="48" rx="5" fill="#10192a" stroke="#EF9F27" stroke-width="2"/>
          <text x="2215" y="138" font-size="14" font-weight="700" text-anchor="middle" fill="#f0f6fc">WHY DO ASTRONAUTS</text>
          <text x="2215" y="156" font-size="14" font-weight="700" text-anchor="middle" fill="#f0f6fc">USE LINUX?</text>
        </g>
      </g>
      <g>
        <circle cx="220" cy="478" r="122" fill="none" stroke="#3fb950" stroke-width="2" opacity=".18"/>
        <circle cx="220" cy="478" r="118" fill="url(#apg)"/>
        <ellipse cx="172" cy="381" rx="10" ry="4" fill="#16251f" transform="rotate(-14 172 381)"/>
        <ellipse cx="262" cy="378" rx="7" ry="3" fill="#16251f" transform="rotate(12 262 378)"/>
        <ellipse cx="220" cy="362" rx="16" ry="3" fill="#000000" opacity=".3"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" values="-1.2 220 361;1.2 220 361;-1.2 220 361" dur="4s" repeatCount="indefinite"/>
          <line x1="209" y1="332" x2="196" y2="284" stroke="#3fb950" stroke-width="3" stroke-linecap="round"/>
          <line x1="231" y1="332" x2="244" y2="284" stroke="#3fb950" stroke-width="3" stroke-linecap="round"/>
          <line x1="213" y1="350" x2="211" y2="361" stroke="#3fb950" stroke-width="3.5" stroke-linecap="round"/>
          <line x1="227" y1="350" x2="229" y2="361" stroke="#3fb950" stroke-width="3.5" stroke-linecap="round"/>
          <ellipse cx="220" cy="336" rx="13" ry="16" fill="#3fb950"/>
          <circle cx="220" cy="311" r="12" fill="#3fb950"/>
          <ellipse cx="220" cy="311" rx="4.5" ry="5.5" fill="#0d1420"/>
          <circle cx="221.5" cy="309" r="1.3" fill="#f0f6fc"/>
          <line x1="220" y1="300" x2="220" y2="292" stroke="#3fb950" stroke-width="2"/>
          <circle class="ult" cx="220" cy="289.5" r="2.2" fill="#EF9F27" style="animation-delay:.5s"/>
          <circle cx="196" cy="284" r="2.6" fill="#3fb950"/>
          <circle cx="244" cy="284" r="2.6" fill="#3fb950"/>
          <rect x="156" y="246" width="128" height="38" rx="4" fill="#10192a" stroke="#EF9F27" stroke-width="1.5"/>
          <text x="220" y="261" font-size="10" text-anchor="middle" fill="#EF9F27">you can't open</text>
          <text x="220" y="275" font-size="10" text-anchor="middle" fill="#EF9F27">windows in space</text>
        </g>
      </g>
    </g>
    <use href="#wc" x="2400"/>
  </g>

  <text x="30" y="34" font-size="12" fill="#3f4c63" opacity=".9">$ ./voyage jami --autopilot</text>

  <g transform="translate(150 210)">
    <g class="dodge">
      <g class="wob">
        <path d="M -42 -3 L -175 -1 L -175 1 L -42 3 Z" fill="url(#trg)" opacity=".45"/>
        <circle class="pufT" cx="-52" cy="0" r="3" fill="#EF9F27"/>
        <circle class="pufT pf2" cx="-50" cy="-4" r="2.5" fill="#8b949e"/>
        <circle class="pufT pf3" cx="-50" cy="4" r="2.5" fill="#8b949e"/>
        <circle class="eg" cx="-40" cy="0" r="9" fill="#EF9F27"/>
        <g class="flame">
          <path d="M -36 -9 C -62 -12 -76 -4 -84 0 C -76 4 -62 12 -36 9 Z" fill="#EF9F27" opacity=".9"/>
          <path d="M -36 -5 C -54 -6 -64 -2 -70 0 C -64 2 -54 6 -36 5 Z" fill="#ffd27a"/>
        </g>
        <path d="M -18 -13 L -34 -27 L -4 -13 Z" fill="#EF9F27"/>
        <path d="M -18 13 L -34 27 L -4 13 Z" fill="#EF9F27"/>
        <path d="M -34 -13 Q -44 0 -34 13 L 12 13 C 30 13 44 5 50 0 C 44 -5 30 -13 12 -13 Z" fill="#e8edf4" stroke="#8b98ab" stroke-width="1"/>
        <path d="M 26 -11 C 38 -7 47 -2 50 0 C 47 2 38 7 26 11 Q 33 0 26 -11 Z" fill="#EF9F27"/>
        <circle cx="6" cy="0" r="7" fill="#0d1420" stroke="#EF9F27" stroke-width="2"/>
        <path d="M 2 -3 Q 6 -6 9 -2" fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <rect x="2" y="2" width="896" height="416" rx="14" fill="none" stroke="#1c2230" stroke-width="2"/>
</svg>
